# OpenCode on the base agent, build ba54cee5 (sst/opencode, 2026-02-12;
# embedded @ai-sdk/anthropic 2.0.58): the build the #196 OpenCode real arm
# ran. Researcher ruling 2026-10-30 moved this config off the sheet's
# c10134729d to ba54cee5.
#
# [rows.N] cite the sheet (prereg/harness-components-2026-10-24.csv):
#   sheet  = the sheet's `opencode` cell (written for c10134729d)
#   source = the sheet's `opencode_src` cell, then "ba54cee5:" and the path
#            at the build this config reproduces, or the capture
# The sheet column for every row is opencode_src.

schema = 1
name = "opencode"
harness = "opencode"
harness_pin = "ba54cee55e18b47fb70badc84ae2cbac7c83d258"
description = "OpenCode ba54cee5 build agent on Claude: anthropic.txt prompt, 11 tools, todowrite, task subagents, Sonnet-pinned title call, overflow compaction."

[modules.M1]
impl = "opencode"
# header: the Claude Code identity line OpenCode ba54cee5 sends for the
# anthropic provider (sst/opencode ba54cee5:
# packages/opencode/src/session/prompt/anthropic_spoof.txt, via
# session/system.ts header() and session/llm.ts): its own system block, then
# the prefix of the main block. PM go 2026-10-30.
params = { provider_id = "anthropic", context_files = false, header = "anthropic_spoof.txt" }

# Tool list and order as the real ba54cee5 capture sends them
# (captures/opencode/): question, bash, read, glob, grep, edit, write, task,
# webfetch, todowrite, skill. No `invalid`, websearch or apply_patch.
[modules.M2]
impl = "catalog"
params = { family = "opencode", tools = ["question", "bash", "read", "glob", "grep", "edit", "write", "task", "webfetch", "todowrite", "skill"] }

[modules.M3]
impl = "anthropic"
params = { system = 2, tools = false, messages = 2 }

# #189: small_model pinned to Sonnet 5.5 (not OpenCode's Haiku default);
# the row records small_model_deviation = true.
[modules.M5]
impl = "opencode_title"
params = { model = "claude-sonnet-5-5" }

[modules.M6]
impl = "summarize"
params = { context_window = 200000, reserve_tokens = 20000 }

[modules.M7]
impl = "opencode_edit"

[modules.M8]
impl = "shell"
params = { default_timeout_s = 120, timeout_unit = "ms", max_lines = 2000, max_bytes = 51200, keep = "head" }

[modules.M9]
impl = "opencode_todowrite"

[modules.M10]
impl = "opencode_task"

[modules.M11]
impl = "basic"
params = { hooks = ["doom_loop"], doom_threshold = 3, doom_action = "log" }

# OpenCode's own sampling, read from the real capture: max_tokens 32000, no
# temperature, thinking off. Row 9 ruling 2026-10-30.
[parity.M4]
impl = "fixed"
params = { max_tokens = 32000 }

# --- citations: every swappable row ----------------------------------------
[rows.1]
value = "M1 opencode: anthropic.txt (8.2 KB, vendored; identical at ba54cee5) + the ba54cee5 environment block, after the ba54cee5 Claude Code identity header (anthropic_spoof.txt: own block + prefix of the main block)"
sheet = "Per-model-family full base prompt picked by model ID: anthropic.txt 8.2 KB for Claude, gemini.txt 15.4 KB, default.txt 8.5 KB (others: gpt/codex/beast/kimi/meta/trinity 4-14 KB) + env/AGENTS.md instructions"
