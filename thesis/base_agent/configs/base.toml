# Neutral base-agent defaults. This is the named swap baseline the brief
# asks for (section 3.2, "base-agent identity drift"): it is not any real
# harness and needs no sheet citations. Every value here is versioned through
# base_agent_version.

schema = 1
name = "base"
harness = "base"
description = "Minimal base agent: bash, read, write, exact-replace edit; no planner, subagents, side calls or compaction."

[modules.M1]
impl = "base"
params = { context_files = false }

[modules.M2]
impl = "catalog"
params = { family = "base", tools = ["bash", "read", "edit", "write"] }

[modules.M3]
impl = "anthropic"
params = { system = true, tools = false, messages = 2 }

[modules.M5]
impl = "none"

[modules.M6]
impl = "none"

[modules.M7]
impl = "replace"

[modules.M8]
impl = "shell"
params = { default_timeout_s = 120, max_lines = 2000, max_bytes = 51200, keep = "tail" }

[modules.M9]
impl = "none"

[modules.M10]
impl = "none"

[modules.M11]
impl = "basic"
params = { hooks = [] }
