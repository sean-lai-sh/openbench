# Pi on the base agent. Parity target: the real Pi arm (badlogic/pi-mono
# @ d0aa218, the pin of both the sheet and the #196 Pi cells).
#
# [rows.N] cite the sheet (prereg/harness-components-2026-10-24.csv):
#   value  = what the module reproduces
#   sheet  = the sheet's `pi` cell
#   source = the sheet's `pi_src` cell, or the SC-1 addendum
#            (briefs/stage4-slot-contract-SC1-addendum-2026-10-26.csv) where
#            the sheet cell was "not found" / "not traced" and SC-1 resolved it.
# The sheet column for every row is pi_src.

schema = 1
name = "pi"
harness = "pi"
harness_pin = "d0aa218cb16c333c008f6aa3dcd670ac8b68383c"
description = "Pi default coding agent: read, bash, edit (edits[]), write; no planner, subagents, side calls; compaction at reserve 16384."

[modules.M1]
impl = "pi"
params = { context_files = true }

[modules.M2]
impl = "catalog"
params = { family = "pi", tools = ["read", "bash", "edit", "write"] }

[modules.M3]
impl = "anthropic"
params = { system = 1, tools = true, messages = 1 }

[modules.M5]
impl = "none"

[modules.M6]
impl = "summarize"
params = { context_window = 200000, reserve_tokens = 16384 }

[modules.M7]
impl = "pi_edit"

[modules.M8]
impl = "shell"
params = { timeout_unit = "s", max_lines = 2000, max_bytes = 51200, keep = "tail" }

[modules.M9]
impl = "none"

[modules.M10]
impl = "none"

[modules.M11]
impl = "basic"
params = { hooks = [] }

# Parity arm only. Must be replaced with the values the real Pi request
# carries (max_tokens / temperature / thinking), read from the AC3 capture.
[parity.M4]
impl = "fixed"
params = { max_tokens = 32000 }

# --- citations: every swappable row ----------------------------------------
[rows.1]
value = "M1 pi: preamble + <tools>/<rules>/<docs>/<project_context>/<cwd> sections built as system-prompt.ts does"
sheet = "Assembled in code (system-prompt.ts 10 KB source) + tool guidelines + AGENTS/CLAUDE.md + optional .pi/SYSTEM.md/APPEND_SYSTEM.md"
source = "core/system-prompt.ts; core/resource-loader.ts:212; docs/security.md"

[rows.2]
value = "M1 pi: AGENTS.md/CLAUDE.md walk-up into <project_context>; tool list and rules follow the enabled tools"
sheet = "Varies with cwd context files and enabled tools"
