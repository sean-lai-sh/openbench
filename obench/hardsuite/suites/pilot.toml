# OpenBench Hard: 10-task pilot (SEA-106). Exercises the whole reflection
# pipeline before the full suite. Chosen from Terminal-Bench 2 tasks already in
# the repo (commit 2fd12b88aafdd04a52c298e3940bcb189f9766d6) by:
#   - difficulty: published frontier-panel solve rate between 7.7% and 69.2%,
#     with no 0% tasks (no material to learn from) and none at 85% or above
#     (would pass at once);
#   - multi-step: every task needs several shell/edit rounds, so credit
#     assignment has steps to choose between;
#   - one task per domain, no repeats.
# frontier_rate: harborframework/terminal-bench-2-leaderboard@572b2614 (see
# data/packs/openbench-tb-hard/tb2-frontier-rates.csv). It is a prior only;
# pass/fail for the swap rule is each model's own pass rate.
schema = "openbench.hard-suite/v1"
name = "pilot"
pool = "pilot-pool"
planned_size = 10

[[task]]
id = "dna-insert"
source = "openbench-tb-hard"
frontier_rate = 0.077
domain = "bioinformatics / primer design"
why = "The hard end of the pilot (1/13 frontier). Design primers and a cloning plan across several tool runs; failures are usually a wrong intermediate, which gives Method A/B a clear first failing step."

[[task]]
id = "model-extraction-relu-logits"
source = "openbench-tb-hard"
frontier_rate = 0.250
domain = "adversarial machine learning"
why = "Hard but solvable (3/12). A query-explore-fit loop: probe the network, find ReLU kinks, recover the weights. Credit assignment can tell a bad probing strategy apart from a bad numerical step."

[[task]]
id = "dna-assembly"
source = "terminal-bench-2"
frontier_rate = 0.273
domain = "bioinformatics / sequence assembly"
why = "Hard (3/11) and long-horizon. Fragments must be assembled and checked, and early mistakes surface only at verification, which tests how far back Method B looks (K earlier steps)."

[[task]]
id = "polyglot-rust-c"
source = "openbench-tb-hard"
frontier_rate = 0.385
domain = "systems / polyglot binaries"
why = "Boundary task (5/13), already the hard-suite smoke task for the harness comparison. One source file must compile and run under two toolchains, with compile-fix iterations, so the trace is long."

[[task]]
id = "adaptive-rejection-sampler"
source = "openbench-tb-mid"
frontier_rate = 0.462
domain = "statistics / Monte Carlo"
why = "Mid band (6/13). Implement and test a sampler against numeric checks; failures are subtle math errors rather than tooling errors."

[[task]]
id = "query-optimize"
source = "openbench-tb-mid"
frontier_rate = 0.462
domain = "databases / SQL optimization"
why = "Mid band (6/13). Measure, rewrite, re-measure: the plan-then-act structure gives the ideation agent tool-metadata levers (how query timings are reported)."

[[task]]
id = "path-tracing"
source = "terminal-bench-2"
frontier_rate = 0.462
domain = "computer graphics / program synthesis"
why = "Mid band (6/13). Reproduce an image with a compact program and compare against a reference, an output-driven iteration loop unlike the other pilot domains."

[[task]]
id = "winning-avg-corewars"
source = "openbench-tb-mid"
frontier_rate = 0.538
domain = "game AI / CoreWars"
why = "Mid band (7/13). Write a warrior, run the simulator, revise; a search loop where reflection on earlier rounds should help."

[[task]]
id = "extract-elf"
source = "terminal-bench-2"
frontier_rate = 0.615
domain = "binary formats / ELF"
why = "Easier mid band (8/13). Parse ELF structures precisely; likely to reach the 90% cutoff for a strong model, which exercises the per-model harder swap in the pilot."

[[task]]
id = "sanitize-git-repo"
source = "openbench-tb-mid"
frontier_rate = 0.692
domain = "repository security / secret scanning"
why = "The easiest pilot task (9/13). Find and remove secrets across git history. It anchors the easy end so the pilot is not all failures, and is the most likely first swap."
