# Harder replacements for the pilot (SEA-106 swap rule). Every task here has a
# lower published frontier rate than at least one pilot task and is not in
# the pilot. Same bench snapshot and rate source as pilot.toml. When a pilot
# task passes for a model, the model gets the easiest pool task that is still
# strictly harder (obench/hardsuite/swap.py).
schema = "openbench.hard-suite/v1"
name = "pilot-pool"

[[task]]
id = "polyglot-c-py"
source = "terminal-bench-2"
frontier_rate = 0.385
domain = "systems / polyglot binaries"
why = "Replacement for the mid-band slots: the C/Python counterpart of polyglot-rust-c, at the same boundary difficulty."

[[task]]
id = "video-processing"
source = "openbench-tb-hard"
frontier_rate = 0.077
domain = "video analytics"
why = "Replacement once a slot passes at ~25% or above: 1/13 frontier."

